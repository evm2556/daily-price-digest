name: daily-deal-digest
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 8am US Eastern (9am during DST)
  push:
    branches: [main]
    paths:
      - items.yaml
      - wishlist.txt
  workflow_dispatch:        # "Run workflow" button
concurrency:
  group: digest
  cancel-in-progress: false  # queue runs instead of overlapping them
permissions:
  contents: write
  models: read              # lets the built-in token call GitHub Models
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Install gh-models
        run: gh extension install github/gh-models || echo "gh-models install failed; REST fallback will be used"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python digest.py
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          REDDIT_RSS_KEY: ${{ secrets.REDDIT_RSS_KEY }}
          WISHLIST_URL: ${{ secrets.WISHLIST_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: digest, path: digest.html }
      - name: Save history
        run: |
          ls -la docs || echo "docs/ is missing"
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "digest $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push