name: daily-deal-digest
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 8am US Eastern (9am during DST)
  workflow_dispatch:        # "Run workflow" button
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          REDDIT_RSS_KEY: ${{ secrets.REDDIT_RSS_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: digest, path: digest.html }
      - name: Save history
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add prices.db digest.html docs/
          git commit -m "digest $(date -u +%F)" || exit 0
          git push